<svg viewBox="0 0 1340 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif"><rect width="1340" height="900" fill="#fff"/><line x1="960" y1="104" x2="460" y2="174" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="714" y="136" font-size="9" fill="#555">item terms</text><line x1="960" y1="204" x2="460" y2="174" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="714" y="186" font-size="9" fill="#555">supplier or customer</text><line x1="250" y1="418" x2="250" y2="450" stroke="#555" stroke-width="1" /><text x="254" y="431" font-size="9" fill="#555">1 : n versions</text><line x1="250" y1="418" x2="250" y2="550" stroke="#555" stroke-width="1" /><text x="254" y="481" font-size="9" fill="#555">1 : n exceptions</text><line x1="250" y1="418" x2="250" y2="700" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="254" y="556" font-size="9" fill="#555">assigned to</text><line x1="1130" y1="418" x2="250" y2="700" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="694" y="556" font-size="9" fill="#555">per company</text><line x1="1130" y1="318" x2="250" y2="700" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="694" y="506" font-size="9" fill="#555">optional warehouse override</text><line x1="1130" y1="270" x2="720" y2="158" stroke="#555" stroke-width="1" /><text x="929" y="211" font-size="9" fill="#555">1 : n</text><line x1="1130" y1="138" x2="720" y2="220" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="929" y="176" font-size="9" fill="#555">ordered item</text><line x1="1130" y1="138" x2="720" y2="390" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="929" y="261" font-size="9" fill="#555">ordered item</text><line x1="720" y1="560" x2="720" y2="348" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="724" y="451" font-size="9" fill="#555">reads demand</text><line x1="720" y1="560" x2="720" y2="518" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="724" y="536" font-size="9" fill="#555">reads supply</text><line x1="920" y1="634" x2="1130" y2="538" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="1029" y="583" font-size="9" fill="#555">reads stock and reservations</text><line x1="720" y1="560" x2="720" y2="158" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="724" y="356" font-size="9" fill="#555">TRANSIT separate</text><rect x="40" y="70" width="420" height="208" fill="#fff" stroke="#d6b656" /><rect x="40" y="70" width="420" height="28" fill="#fff2cc" stroke="#d6b656"/><text x="46" y="88" font-size="12" font-weight="bold">item_partner  (V)</text><text x="46" y="112" font-size="10" font-weight="bold">PK  tenant_id, item_id, partner_id, company_key, valid_from</text><text x="46" y="132" font-size="10" >company_key  0 = tenant row, else company_id  (override)</text><text x="46" y="152" font-size="10" >relation  SUPPLIER | CUSTOMER</text><text x="46" y="172" font-size="10" >partner_item_no, partner_item_description</text><text x="46" y="192" font-size="10" >lead_time_days  (calendar days)</text><text x="46" y="212" font-size="10" >min_order_qty, order_multiple  (information only)</text><text x="46" y="232" font-size="10" >origin_country  (FK ref_country)</text><text x="46" y="252" font-size="10" >is_preferred  (one per item and company)</text><text x="46" y="272" font-size="10" >active</text><rect x="40" y="330" width="420" height="88" fill="#fff" stroke="#6c8ebf" /><rect x="40" y="330" width="420" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="46" y="348" font-size="12" font-weight="bold">business_calendar  (M)</text><text x="46" y="372" font-size="10" font-weight="bold">PK  tenant_id, calendar_id</text><text x="46" y="392" font-size="10" >UK code</text><text x="46" y="412" font-size="10" >name, country_code  (optional), active</text><rect x="40" y="450" width="420" height="68" fill="#fff" stroke="#d6b656" /><rect x="40" y="450" width="420" height="28" fill="#fff2cc" stroke="#d6b656"/><text x="46" y="468" font-size="12" font-weight="bold">business_calendar_version  (V)</text><text x="46" y="492" font-size="10" font-weight="bold">PK, FK  tenant_id, calendar_id, valid_from</text><text x="46" y="512" font-size="10" >working_weekdays  (7 chars, Monday first, 1111100)</text><rect x="40" y="550" width="420" height="108" fill="#fff" stroke="#d6b656" /><rect x="40" y="550" width="420" height="28" fill="#fff2cc" stroke="#d6b656"/><text x="46" y="568" font-size="12" font-weight="bold">business_calendar_exception  (V)</text><text x="46" y="592" font-size="10" font-weight="bold">PK, FK  tenant_id, calendar_id, exception_date, created_at</text><text x="46" y="612" font-size="10" >is_working_day  (false = holiday)</text><text x="46" y="632" font-size="10" >description, created_at</text><text x="46" y="652" font-size="10" >insert only, later created_at wins</text><rect x="40" y="700" width="420" height="108" fill="#fff" stroke="#d6b656" /><rect x="40" y="700" width="420" height="28" fill="#fff2cc" stroke="#d6b656"/><text x="46" y="718" font-size="12" font-weight="bold">company_calendar_assignment  (V)</text><text x="46" y="742" font-size="10" font-weight="bold">PK  tenant_id, company_id, warehouse_key, valid_from</text><text x="46" y="762" font-size="10" >warehouse_key  warehouse_id, 0 = company level  (no null)</text><text x="46" y="782" font-size="10" >FK calendar_id</text><text x="46" y="802" font-size="10" >warehouse row overrides company row</text><rect x="520" y="70" width="400" height="88" fill="#fff" stroke="#6c8ebf" /><rect x="520" y="70" width="400" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="526" y="88" font-size="12" font-weight="bold">warehouse_location</text><text x="526" y="112" font-size="10" font-weight="bold">PK  tenant_id, company_id, warehouse_id, location_id</text><text x="526" y="132" font-size="10" >location_code, name, active</text><text x="526" y="152" font-size="10" >location_type  STANDARD | TRANSIT | QUARANTINE  (L1)</text><rect x="520" y="220" width="400" height="128" fill="#fff" stroke="#6c8ebf" /><rect x="520" y="220" width="400" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="526" y="238" font-size="12" font-weight="bold">sales_order_line</text><text x="526" y="262" font-size="10" font-weight="bold">PK  ..., sales_order_id, line_no</text><text x="526" y="282" font-size="10" >FK item_id, warehouse_id</text><text x="526" y="302" font-size="10" >requested_date  (L2)  default from header</text><text x="526" y="322" font-size="10" >confirmed_date  (L2)  promised date</text><text x="526" y="342" font-size="10" >quantity, base_quantity, line_status</text><rect x="520" y="390" width="400" height="128" fill="#fff" stroke="#6c8ebf" /><rect x="520" y="390" width="400" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="526" y="408" font-size="12" font-weight="bold">purchase_order_line</text><text x="526" y="432" font-size="10" font-weight="bold">PK  ..., purchase_order_id, line_no</text><text x="526" y="452" font-size="10" >FK item_id, warehouse_id</text><text x="526" y="472" font-size="10" >requested_date  (L2)  default: header expected_receipt_date</text><text x="526" y="492" font-size="10" >confirmed_date  (L2)  confirmed by the supplier</text><text x="526" y="512" font-size="10" >quantity, base_quantity, line_status</text><rect x="520" y="560" width="400" height="148" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="520" y="560" width="400" height="28" fill="#f5f5f5" stroke="#999999"/><text x="526" y="578" font-size="12" font-weight="bold">supply-demand:query  (read API, nothing stored)</text><text x="526" y="602" font-size="10" >reads order lines  (open quantity, dated)</text><text x="526" y="622" font-size="10" >reads stock by status, TRANSIT separate</text><text x="526" y="642" font-size="10" >reads open stock reservations</text><text x="526" y="662" font-size="10" >buckets DAY | WEEK | MONTH, PAST_DUE, UNDATED</text><text x="526" y="682" font-size="10" >no netting, no promising  (apps)</text><text x="526" y="702" font-size="10" >calendar:add-working-days  (helper, read only)</text><rect x="960" y="70" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="960" y="70" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="966" y="88" font-size="12" font-weight="bold">item  (stub)</text><text x="966" y="112" font-size="10" font-weight="bold">PK  tenant_id, item_id</text><text x="966" y="132" font-size="10" >base_unit</text><rect x="960" y="170" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="960" y="170" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="966" y="188" font-size="12" font-weight="bold">business_partner  (stub)</text><text x="966" y="212" font-size="10" font-weight="bold">PK  tenant_id, partner_id</text><text x="966" y="232" font-size="10" >is_customer, is_supplier</text><rect x="960" y="270" width="340" height="48" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="960" y="270" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="966" y="288" font-size="12" font-weight="bold">warehouse  (stub)</text><text x="966" y="312" font-size="10" font-weight="bold">PK  tenant_id, company_id, warehouse_id</text><rect x="960" y="370" width="340" height="48" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="960" y="370" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="966" y="388" font-size="12" font-weight="bold">company  (stub)</text><text x="966" y="412" font-size="10" font-weight="bold">PK  tenant_id, company_id</text><rect x="960" y="470" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="960" y="470" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="966" y="488" font-size="12" font-weight="bold">stock and reservations  (stubs)</text><text x="966" y="512" font-size="10" >stock_movement balances by status</tex