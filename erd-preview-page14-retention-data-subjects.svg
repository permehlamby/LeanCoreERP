<svg viewBox="0 0 1340 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif"><rect width="1340" height="900" fill="#fff"/><line x1="250" y1="488" x2="250" y2="540" stroke="#555" stroke-width="1" /><text x="254" y="511" font-size="9" fill="#555">1 : n</text><line x1="460" y1="394" x2="960" y2="134" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="714" y="261" font-size="9" fill="#555">PARTNER scope</text><line x1="920" y1="204" x2="960" y2="134" stroke="#555" stroke-width="1" /><text x="944" y="166" font-size="9" fill="#555">subject</text><line x1="710" y1="338" x2="710" y2="640" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="714" y="486" font-size="9" fill="#555">erasure outcome</text><line x1="710" y1="608" x2="710" y2="640" stroke="#555" stroke-width="1" /><text x="714" y="621" font-size="9" fill="#555">1 : n</text><line x1="710" y1="640" x2="1130" y2="308" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="924" y="471" font-size="9" fill="#555">clears</text><line x1="710" y1="640" x2="1130" y2="428" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="924" y="531" font-size="9" fill="#555">clears</text><line x1="460" y1="164" x2="960" y2="384" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="714" y="271" font-size="9" fill="#555">sets retention_until at creation</text><line x1="460" y1="394" x2="500" y2="504" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="484" y="446" font-size="9" fill="#555">holds skip records</text><rect x="40" y="70" width="420" height="188" fill="#fff" stroke="#d6b656" /><rect x="40" y="70" width="420" height="28" fill="#fff2cc" stroke="#d6b656"/><text x="46" y="88" font-size="12" font-weight="bold">retention_rule  (V)</text><text x="46" y="112" font-size="10" font-weight="bold">PK  tenant_id, company_id, rule_id, effective_from</text><text x="46" y="132" font-size="10" >record_class  LEDGER|VAT_RETURN|STOCK|ORDER|FULFILMENT|INVOICE_ISSUE|LEGAL_SNAPSHOT|ADDRESS_SNAPSHOT|AUDIT_LOG|READ_LOG</text><text x="46" y="152" font-size="10" >country_code</text><text x="46" y="172" font-size="10" >retention_years</text><text x="46" y="192" font-size="10" >start_event  FISCAL_YEAR_END | RECORD_DATE</text><text x="46" y="212" font-size="10" >legal_basis</text><text x="46" y="232" font-size="10" >longest period wins, new records only</text><text x="46" y="252" font-size="10" >retention:extend lengthens stored dates</text><rect x="40" y="300" width="420" height="188" fill="#fff" stroke="#6c8ebf" /><rect x="40" y="300" width="420" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="46" y="318" font-size="12" font-weight="bold">legal_hold</text><text x="46" y="342" font-size="10" font-weight="bold">PK  tenant_id, hold_id</text><text x="46" y="362" font-size="10" >scope_type  TENANT | COMPANY | PARTNER | DOCUMENT_SET</text><text x="46" y="382" font-size="10" >FK company_id, partner_id  (by scope)</text><text x="46" y="402" font-size="10" >reason_code, case_reference, authority</text><text x="46" y="422" font-size="10" >placed_by, placed_at</text><text x="46" y="442" font-size="10" >status  ACTIVE | RELEASED</text><text x="46" y="462" font-size="10" >released_by, released_at, release_reason</text><text x="46" y="482" font-size="10" >row_version</text><rect x="40" y="540" width="420" height="68" fill="#fff" stroke="#b85450" /><rect x="40" y="540" width="420" height="28" fill="#f8cecc" stroke="#b85450"/><text x="46" y="558" font-size="12" font-weight="bold">legal_hold_document</text><text x="46" y="582" font-size="10" font-weight="bold">PK, FK  tenant_id, hold_id, entity_type, entity_id</text><text x="46" y="602" font-size="10" >covers the document and its snapshots</text><rect x="500" y="70" width="420" height="268" fill="#fff" stroke="#6c8ebf" /><rect x="500" y="70" width="420" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="506" y="88" font-size="12" font-weight="bold">data_subject_request</text><text x="506" y="112" font-size="10" font-weight="bold">PK  tenant_id, request_id</text><text x="506" y="132" font-size="10" >FK partner_id  (kind PERSON only)</text><text x="506" y="152" font-size="10" >request_type  ACCESS|RECTIFICATION|ERASURE|RESTRICTION|OBJECTION|PORTABILITY</text><text x="506" y="172" font-size="10" >received_at, due_date</text><text x="506" y="192" font-size="10" >status  (S)  RECEIVED|IN_PROGRESS|COMPLETED|REFUSED|</text><text x="506" y="212" font-size="10" >     PARTIALLY_COMPLETED|WITHDRAWN</text><text x="506" y="232" font-size="10" >decision_code  FULFILLED|REFUSED_RETENTION|REFUSED_HOLD|...</text><text x="506" y="252" font-size="10" >blocking_until</text><text x="506" y="272" font-size="10" >decided_by, decided_at</text><text x="506" y="292" font-size="10" >outcome_ref  (run item or export job)</text><text x="506" y="312" font-size="10" >notes  (no personal data)</text><text x="506" y="332" font-size="10" >row_version</text><rect x="500" y="400" width="420" height="208" fill="#fff" stroke="#b85450" /><rect x="500" y="400" width="420" height="28" fill="#f8cecc" stroke="#b85450"/><text x="506" y="418" font-size="12" font-weight="bold">anonymisation_run</text><text x="506" y="442" font-size="10" font-weight="bold">PK  tenant_id, run_id</text><text x="506" y="462" font-size="10" >run_type  SCHEDULED | REQUESTED</text><text x="506" y="482" font-size="10" >mode  DRY_RUN | EXECUTE</text><text x="506" y="502" font-size="10" >scope, started_at, completed_at</text><text x="506" y="522" font-size="10" >status  (S)  RUNNING|COMPLETE|FAILED</text><text x="506" y="542" font-size="10" >snapshots_anonymised, partners_anonymised</text><text x="506" y="562" font-size="10" >skipped_hold, skipped_retention, skipped_open_items, failed</text><text x="506" y="582" font-size="10" >outbox_events_purged  (app events, retention)</text><text x="506" y="602" font-size="10" >requested_by, correlation_id</text><rect x="500" y="640" width="420" height="148" fill="#fff" stroke="#b85450" /><rect x="500" y="640" width="420" height="28" fill="#f8cecc" stroke="#b85450"/><text x="506" y="658" font-size="12" font-weight="bold">anonymisation_run_item</text><text x="506" y="682" font-size="10" font-weight="bold">PK, FK  tenant_id, run_id, item_no</text><text x="506" y="702" font-size="10" >entity_type  PARTNER | LEGAL_SNAPSHOT | ADDRESS_SNAPSHOT</text><text x="506" y="722" font-size="10" >entity_id, company_id, field_groups</text><text x="506" y="742" font-size="10" >outcome  ANONYMISED|SKIPPED_HOLD|SKIPPED_RETENTION|</text><text x="506" y="762" font-size="10" >     SKIPPED_OPEN_ITEMS|SKIPPED_ACTIVE|SKIPPED_REQUEST|FAILED</text><text x="506" y="782" font-size="10" >reason_code  (ids only, no personal data)</text><rect x="960" y="70" width="340" height="128" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="960" y="70" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="966" y="88" font-size="12" font-weight="bold">business_partner  (stub)</text><text x="966" y="112" font-size="10" >status  ACTIVE | BLOCKED | ANONYMISED</text><text x="966" y="132" font-size="10" >retention_until  (S)  latest record retention</text><text x="966" y="152" font-size="10" >retention_floor  (S)  minimum, set by retention:extend</text><text x="966" y="172" font-size="10" >restriction_status  (S)  NONE | RESTRICTED</text><text x="966" y="192" font-size="10" >anonymised_at</text><rect x="960" y="220" width="340" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="960" y="220" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="966" y="238" font-size="12" font-weight="bold">partner pii, bank, vat_id, credit limits</text><text x="966" y="262" font-size="10" >overwritten at anonymisation</text><text x="966" y="282" font-size="10" >search columns cleared</text><text x="966" y="302" font-size="10" >credit limits of persons cleared</text><rect x="960" y="340" width="340" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="960" y="340" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="966" y="358" font-size="12" font-weight="bold">document_legal_snapshot  (stub)</text><text x="966" y="382" font-size="10" >retention_until  (S)</text><text x="966" y="402" font-size="10" >L1* overwritten by retention job only</text><text x="966" y="422" font-size="10" >electronic_address, legal_registration_id</text><rect x="960" y="470" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="960" y="470" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="966" y="488" font-size="12" font-weight="bold">order_address_snapshot  (stub)</text><text x="966" y="512" font-size="10" >retention_until  (S)</text><text x="966" y="532" font-size="10" >overwritten by retention job only</text><rect x="960" y="580" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="960" y="580" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="966" y="598" font-size="12" font-weight="bold">tenant_setting  (stub)</text><text x="966" y="622" font-size="10" >anonymisation_dry_run_weeks, dsr_response_days</text><text x="966" y="642" font-size="10" >anonymisation_first_run_at  (S)</text></svg>