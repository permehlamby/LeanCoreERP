<svg viewBox="0 0 1340 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif"><rect width="1340" height="900" fill="#fff"/><line x1="460" y1="254" x2="520" y2="234" stroke="#555" stroke-width="1" /><text x="494" y="241" font-size="9" fill="#555">1 : 1..n</text><line x1="460" y1="254" x2="1170" y2="560" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="819" y="404" font-size="9" fill="#555">derives journal (same transaction)</text><line x1="1020" y1="114" x2="460" y2="254" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="744" y="181" font-size="9" fill="#555">chain per company</text><line x1="750" y1="398" x2="750" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="754" y="431" font-size="9" fill="#555">receipt creates layer (FIFO)</text><line x1="750" y1="398" x2="750" y2="670" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="754" y="531" font-size="9" fill="#555">issue consumes layers</text><line x1="750" y1="638" x2="750" y2="670" stroke="#555" stroke-width="1" /><text x="754" y="651" font-size="9" fill="#555">1 : n</text><line x1="250" y1="618" x2="250" y2="640" stroke="#555" stroke-width="1" /><text x="254" y="626" font-size="9" fill="#555">1 : n events</text><line x1="250" y1="640" x2="250" y2="438" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="254" y="536" font-size="9" fill="#555">CONSUME by issue</text><line x1="1020" y1="294" x2="460" y2="254" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="744" y="271" font-size="9" fill="#555">cost adjustment document</text><line x1="1170" y1="388" x2="1170" y2="410" stroke="#555" stroke-width="1" /><text x="1174" y="396" font-size="9" fill="#555">1 : n</text><path d="M 1320 260 h 25 v 40 h -25" fill="none" stroke="#555" stroke-width="1"/><text x="1350" y="285" font-size="9" fill="#555">reversal_of_allocation_id</text><line x1="1170" y1="410" x2="980" y2="234" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="1079" y="319" font-size="9" fill="#555">target receipt line</text><line x1="1170" y1="700" x2="1170" y2="158" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="1174" y="426" font-size="9" fill="#555">anchors head</text><rect x="40" y="70" width="420" height="368" fill="#fff" stroke="#82b366" /><rect x="40" y="70" width="420" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="46" y="88" font-size="12" font-weight="bold">stock_document</text><text x="46" y="112" font-size="10" font-weight="bold">PK  tenant_id, company_id, stock_document_id</text><text x="46" y="132" font-size="10" >UK number_series_id, fiscal_year, sequence_no</text><text x="46" y="152" font-size="10" >document_type  STOCK_RECEIPT|ISSUE|TRANSFER|ADJUSTMENT|STATUS_CHANGE|COST_ADJUSTMENT|RETURN|OPENING|REVERSAL</text><text x="46" y="172" font-size="10" >document_number, fiscal_period  (L1)</text><text x="46" y="192" font-size="10" >document_date, posting_date, posted_at  (L1)</text><text x="46" y="212" font-size="10" >reason_code  (L1)</text><text x="46" y="232" font-size="10" >status  (S)  posted | reversed</text><text x="46" y="252" font-size="10" >FK reversal_of_stock_document_id  (L1)</text><text x="46" y="272" font-size="10" >reversed_by_stock_document_id  (S)</text><text x="46" y="292" font-size="10" >FK journal_document_id  (L1, null if no value)</text><text x="46" y="312" font-size="10" >currency_tc  (L1, one transaction currency per document)</text><text x="46" y="332" font-size="10" >soft_close_override  (L1)</text><text x="46" y="352" font-size="10" >source_system, source_document_ref  (L1)</text><text x="46" y="372" font-size="10" >UK idempotency_key, command_name, correlation_id</text><text x="46" y="392" font-size="10" >header_text  (L2)</text><text x="46" y="412" font-size="10" >movement_count, movement_digest, detail_digest  (L1)</text><text x="46" y="432" font-size="10" >chain_seq, prev_hash, row_hash, hash_version  (L1)</text><rect x="520" y="70" width="460" height="328" fill="#fff" stroke="#82b366" /><rect x="520" y="70" width="460" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="526" y="88" font-size="12" font-weight="bold">stock_movement  (stock ledger)</text><text x="526" y="112" font-size="10" font-weight="bold">PK, FK  tenant_id, company_id, stock_document_id, line_no</text><text x="526" y="132" font-size="10" >movement_type  RECEIPT|ISSUE|TRANSFER_OUT/IN|ADJUST_IN/OUT|STATUS_OUT/IN|COST_ADJUST|RETURN_IN/OUT|OPENING_IN</text><text x="526" y="152" font-size="10" >posting_date  (L1)</text><text x="526" y="172" font-size="10" >FK item_id, warehouse_id, location_id, tracking_id</text><text x="526" y="192" font-size="10" >stock_status  AVAILABLE|QUARANTINE|BLOCKED</text><text x="526" y="212" font-size="10" >quantity, unit_code, base_quantity  (signed)</text><text x="526" y="232" font-size="10" >value_lc  (signed change of inventory value)</text><text x="526" y="252" font-size="10" >cost_source  COMPUTED|SUPPLIED|INVOICE|MIGRATION  (L1)</text><text x="526" y="272" font-size="10" >unit_cost_lc, value_tc, currency_tc</text><text x="526" y="292" font-size="10" >cost_warehouse_id  (set if cost scope = WAREHOUSE)</text><text x="526" y="312" font-size="10" >cost_qty_after, cost_value_after_lc  (cost key balance)</text><text x="526" y="332" font-size="10" >stock_qty_after  (stock key balance)</text><text x="526" y="352" font-size="10" >lot_expired, count_ref, expected_book_quantity</text><text x="526" y="372" font-size="10" >source_line_ref, reversal_of_line_no</text><text x="526" y="392" font-size="10" >line_text  (L2)</text><rect x="1020" y="70" width="300" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1020" y="70" width="300" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1026" y="88" font-size="12" font-weight="bold">chain_head  (stub)</text><text x="1026" y="112" font-size="10" font-weight="bold">PK  tenant_id, company_id, chain_type, scope_key</text><text x="1026" y="132" font-size="10" >chain_type = STOCK, scope_key empty</text><text x="1026" y="152" font-size="10" >last_seq, last_hash  (S)</text><rect x="520" y="470" width="460" height="168" fill="#fff" stroke="#82b366" /><rect x="520" y="470" width="460" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="526" y="488" font-size="12" font-weight="bold">stock_cost_layer  (FIFO)</text><text x="526" y="512" font-size="10" font-weight="bold">PK, FK  stock_document_id, line_no  (= creating receipt line)</text><text x="526" y="532" font-size="10" >FK item_id, cost_warehouse_id, tracking_id</text><text x="526" y="552" font-size="10" >layer_seq  (per cost key)</text><text x="526" y="572" font-size="10" >layer_date  (L1, DATE, for ageing)</text><text x="526" y="592" font-size="10" >receipt_legacy_ref  (L1, null unless migrated receipt)</text><text x="526" y="612" font-size="10" >quantity_base, unit_cost_lc, value_lc</text><text x="526" y="632" font-size="10" >exhausted  (S)  verified from consumption</text><rect x="520" y="670" width="460" height="108" fill="#fff" stroke="#82b366" /><rect x="520" y="670" width="460" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="526" y="688" font-size="12" font-weight="bold">stock_layer_consumption</text><text x="526" y="712" font-size="10" font-weight="bold">PK  issue line + layer</text><text x="526" y="732" font-size="10" >FK issue stock_document_id, line_no</text><text x="526" y="752" font-size="10" >FK layer document_id, line_no</text><text x="526" y="772" font-size="10" >quantity_base, value_lc</text><rect x="40" y="470" width="420" height="148" fill="#fff" stroke="#82b366" /><rect x="40" y="470" width="420" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="46" y="488" font-size="12" font-weight="bold">stock_reservation</text><text x="46" y="512" font-size="10" font-weight="bold">PK  tenant_id, company_id, reservation_id</text><text x="46" y="532" font-size="10" >FK item_id, warehouse_id</text><text x="46" y="552" font-size="10" >FK tracking_id  (optional)</text><text x="46" y="572" font-size="10" >demand_ref_type  ORDER_LINE | MANUAL</text><text x="46" y="592" font-size="10" >demand_ref, unit_code</text><text x="46" y="612" font-size="10" >created_at, created_by, UK idempotency_key</text><rect x="40" y="640" width="420" height="128" fill="#fff" stroke="#82b366" /><rect x="40" y="640" width="420" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="46" y="658" font-size="12" font-weight="bold">stock_reservation_event</text><text x="46" y="682" font-size="10" font-weight="bold">PK, FK  reservation_id, event_no</text><text x="46" y="702" font-size="10" >event_type  CREATE|INCREASE|DECREASE|RELEASE|CONSUME</text><text x="46" y="722" font-size="10" >base_quantity  (signed change)</text><text x="46" y="742" font-size="10" >event_at, event_by, reason_code</text><text x="46" y="762" font-size="10" >FK stock_document_id  (CONSUME)</text><rect x="1020" y="200" width="300" height="188" fill="#fff" stroke="#82b366" /><rect x="1020" y="200" width="300" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="1026" y="218" font-size="12" font-weight="bold">landed_cost_allocation</text><text x="1026" y="242" font-size="10" font-weight="bold">PK  tenant_id, company_id, allocation_id</text><text x="1026" y="262" font-size="10" >FK stock_document_id  (COST_ADJUSTMENT)</text><text x="1026" y="282" font-size="10" >FK cost_source_document_id, line_no</text><text x="1026" y="302" font-size="10" >allocation_method  VALUE|QUANTITY|WEIGHT|VOLUME</text><text x="1026" y="322" font-size="10" >total_cost_lc</text><text x="1026" y="342" font-size="10" >reversal_of_allocation_id  (L1, mirror rows)</text><text x="1026" y="362" font-size="10" >reason_code  (L1, on the mirror)</text><text x="1026" y="382" font-size="10" >status  (S)  POSTED|REVERSED|MIRROR</text><rect x="1020" y="410" width="300" height="128" fill="#fff" stroke="#82b366" /><rect x="1020" y="410" width="300" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="1026" y="428" font-size="12" font-weight="bold">landed_cost_allocation_line</text><text x="1026" y="452" font-size="10" font-weight="bold">PK, FK  allocation_id, line_no</text><text x="1026" y="472" font-size="10" >FK receipt_document_id, receipt_line_no</text><text x="1026" y="492" font-size="10" >allocated_cost_lc</text><text x="1026" y="512" font-size="10" >on_hand_part_lc  (to inventory)</text><text x="1026" y="532" font-size="10" >consumed_part_lc  (to COGS)</text><rect x="1020" y="560" width="300" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1020" y="560" width="300" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1026" y="578" font-size="12" font-weight="bold">journal_document  (stub)</text><text x="1026" y="602" font-size="10" >document_type  STOCK_*  (system types)</text><text x="1026" y="622" font-size="10" >source_system = INVENTORY</text><text x="1026" y="642" font-size="10" >detail_digest = stock row_hash  (L1)</text><rect x="1020" y="700" width="300" height="48" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1020" y="700" width="300" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1026" y="718" font-size="12" font-weight="bold">chain_anchor  (stub)</text><text x="1026" y="742" font-size="10" >chain_type = STOCK, scope_key empty</text></svg>