inal)</text><text x="486" y="852" font-size="10" >FK purchase_order_id, line_no</text><text x="486" y="872" font-size="10" >base_quantity, reason_code</text><rect x="920" y="520" width="400" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="920" y="520" width="400" height="28" fill="#f5f5f5" stroke="#999999"/><text x="926" y="538" font-size="12" font-weight="bold">stock_document  (stub)</text><text x="926" y="562" font-size="10" >STOCK_ISSUE | STOCK_RECEIPT | STOCK_RETURN</text><text x="926" y="582" font-size="10" >detail_digest = fulfilment row_hash  (L1)</text><rect x="920" y="630" width="400" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="920" y="630" width="400" height="28" fill="#f5f5f5" stroke="#999999"/><text x="926" y="648" font-size="12" font-weight="bold">journal_document  (stub)</text><text x="926" y="672" font-size="10" >derived journal of the stock document</text><text x="926" y="692" font-size="10" >DROPSHIP_COST: detail_digest = confirmation row_hash</text><rect x="920" y="740" width="400" height="48" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="920" y="740" width="400" height="28" fill="#f5f5f5" stroke="#999999"/><text x="926" y="758" font-size="12" font-weight="bold">chain_anchor  (stub)</text><text x="926" y="782" font-size="10" >chain_type = FULFILMENT, scope_key empty</text></svg>