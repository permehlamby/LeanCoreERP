xt x="46" y="132" font-size="10" >chain_type = CLEARING, scope_key empty</text><text x="46" y="152" font-size="10" >last_seq, last_hash, hash_version, updated_at  (S)</text><rect x="40" y="440" width="340" height="168" fill="#fff" stroke="#d6b656" /><rect x="40" y="440" width="340" height="28" fill="#fff2cc" stroke="#d6b656"/><text x="46" y="458" font-size="12" font-weight="bold">journal_line_open_item  (cache = S)</text><text x="46" y="482" font-size="10" font-weight="bold">PK, FK  tenant_id, company_id, document_id, line_no</text><text x="46" y="502" font-size="10" >FK partner_id  (L1, null for GL items)</text><text x="46" y="522" font-size="10" >due_date, baseline_date  (L2)</text><text x="46" y="542" font-size="10" >payment block, terms, discount, bank  (L2)</text><text x="46" y="562" font-size="10" >clearing_status  (S)</text><text x="46" y="582" font-size="10" >cleared_amount_tc/lc/gc/rc  (S)</text><text x="46" y="602" font-size="10" >FK last_clearing_id  (S)</text><rect x="940" y="70" width="340" height="128" fill="#fff" stroke="#6c8ebf" /><rect x="940" y="70" width="340" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="946" y="88" font-size="12" font-weight="bold">journal_document  (difference doc only)</text><text x="946" y="112" font-size="10" font-weight="bold">PK  tenant_id, company_id, document_id</text><text x="946" y="132" font-size="10" >document_type = CLEARING or CLEARING_RESET</text><text x="946" y="152" font-size="10" >document_number, posting_date  (L1)</text><text x="946" y="172" font-size="10" >FK reversal_of_document_id  (L1)</text><text x="946" y="192" font-size="10" >chain_seq, prev_hash, row_hash  (L1)</text><rect x="940" y="300" width="340" height="128" fill="#fff" stroke="#6c8ebf" /><rect x="940" y="300" width="340" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="946" y="318" font-size="12" font-weight="bold">journal_line  (difference lines)</text><text x="946" y="342" font-size="10" font-weight="bold">PK, FK  tenant_id, company_id, document_id, line_no</text><text x="946" y="362" font-size="10" >line_type = FX_REALISED  (FX result)</text><text x="946" y="382" font-size="10" >line_type = CLEARING_DIFF  (offset, cleared in same clearing)</text><text x="946" y="402" font-size="10" >amount_tc = 0, amount_lc/gc/rc = residual  (L1)</text><text x="946" y="422" font-size="10" >FK account_id  (L1)</text><rect x="940" y="520" width="340" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="940" y="520" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="946" y="538" font-size="12" font-weight="bold">chain_head  (stub, LEDGER)</text><text x="946" y="562" font-size="10" font-weight="bold">PK  tenant_id, company_id, chain_type, scope_key</text><text x="946" y="582" font-size="10" >chain_type = LEDGER, scope_key = ledger_id</text><text x="946" y="602" font-size="10" >last_seq, last_hash  (S)</text></svg>