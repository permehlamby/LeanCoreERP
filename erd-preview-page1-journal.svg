_registration_id  (L1*)</text><text x="966" y="232" font-size="10" >retention_until  (S)</text><text x="966" y="252" font-size="10" >anonymised_at  (S)</text><rect x="960" y="330" width="280" height="168" fill="#fff" stroke="#b85450" /><rect x="960" y="330" width="280" height="28" fill="#f8cecc" stroke="#b85450"/><text x="966" y="348" font-size="12" font-weight="bold">change_log  (append-only)</text><text x="966" y="372" font-size="10" font-weight="bold">PK  tenant_id, change_id</text><text x="966" y="392" font-size="10" >change_set_id, company_id</text><text x="966" y="412" font-size="10" >entity_type, document_id, line_no, sub_key</text><text x="966" y="432" font-size="10" >field_name, old_value, new_value</text><text x="966" y="452" font-size="10" >reason_code, reason_text</text><text x="966" y="472" font-size="10" >changed_by, changed_at, correlation_id</text><text x="966" y="492" font-size="10" >idempotency_key, period_status, lock_class</text><rect x="1080" y="540" width="220" height="48" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1080" y="540" width="220" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1086" y="558" font-size="12" font-weight="bold">gl_account  (config)</text><text x="1086" y="582" font-size="10" font-weight="bold">PK  tenant_id, company_id, account_id</text><rect x="40" y="540" width="200" height="48" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="40" y="540" width="200" height="28" fill="#f5f5f5" stroke="#999999"/><text x="46" y="558" font-size="12" font-weight="bold">business_partner  (master)</text><text x="46" y="582" font-size="10" font-weight="bold">PK  tenant_id, partner_id</text><rect x="1080" y="620" width="220" height="48" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1080" y="620" width="220" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1086" y="638" font-size="12" font-weight="bold">tax_code / version  (config)</text><text x="1086" y="662" font-size="10" font-weight