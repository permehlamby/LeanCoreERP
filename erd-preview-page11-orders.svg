<svg viewBox="0 0 1340 950" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif"><rect width="1340" height="950" fill="#fff"/><line x1="680" y1="398" x2="680" y2="410" stroke="#555" stroke-width="1" /><text x="684" y="401" font-size="9" fill="#555">1 : 1..n</text><line x1="1120" y1="358" x2="1120" y2="380" stroke="#555" stroke-width="1" /><text x="1124" y="366" font-size="9" fill="#555">1 : 1..n</text><line x1="880" y1="584" x2="920" y2="544" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="904" y="561" font-size="9" fill="#555">dropship link</text><line x1="480" y1="234" x2="440" y2="364" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="464" y="296" font-size="9" fill="#555">ship-to snapshot</text><line x1="480" y1="234" x2="240" y2="480" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="364" y="354" font-size="9" fill="#555">changes</text><line x1="680" y1="398" x2="680" y2="790" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="684" y="591" font-size="9" fill="#555">events</text><line x1="1120" y1="760" x2="680" y2="398" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="904" y="576" font-size="9" fill="#555">seller order</text><line x1="1120" y1="760" x2="1120" y2="358" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="1124" y="556" font-size="9" fill="#555">buyer order</text><rect x="40" y="70" width="400" height="148" fill="#fff" stroke="#d6b656" /><rect x="40" y="70" width="400" height="28" fill="#fff2cc" stroke="#d6b656"/><text x="46" y="88" font-size="12" font-weight="bold">company_order_setting_version  (V)</text><text x="46" y="112" font-size="10" font-weight="bold">PK  tenant_id, company_id, effective_from</text><text x="46" y="132" font-size="10" >sales_invoice_mode  CORE_BUILDS | APP_SUPPLIES  (default CORE_BUILDS)</text><text x="46" y="152" font-size="10" >auto_reserve  (default false, BEST_EFFORT only)</text><text x="46" y="172" font-size="10" >match_mode_default  THREE_WAY | TWO_WAY</text><text x="46" y="192" font-size="10" >default_over_tolerance_pct, default_under_tolerance_pct  (line)</text><text x="46" y="212" font-size="10" >allow_invoice_before_receipt</text><rect x="480" y="70" width="400" height="328" fill="#fff" stroke="#6c8ebf" /><rect x="480" y="70" width="400" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="486" y="88" font-size="12" font-weight="bold">sales_order</text><text x="486" y="112" font-size="10" font-weight="bold">PK  tenant_id, company_id, sales_order_id</text><text x="486" y="132" font-size="10" >UK number_series, fiscal_year, sequence_no</text><text x="486" y="152" font-size="10" >order_date  (L1)</text><text x="486" y="172" font-size="10" >FK customer_partner_id, order_currency  (L1)</text><text x="486" y="192" font-size="10" >payment_terms_id, customer_reference  (L2)</text><text x="486" y="212" font-size="10" >requested_delivery_date, incoterms_code  (L2)</text><text x="486" y="232" font-size="10" >buyer_reference, contract_reference  (L2)</text><text x="486" y="252" font-size="10" >header_text  (L2)</text><text x="486" y="272" font-size="10" >lifecycle_status  (S)  OPEN|CLOSED|CANCELLED</text><text x="486" y="292" font-size="10" >source_system, source_document_ref  (L1)</text><text x="486" y="312" font-size="10" >ic_transaction_id  (L1)</text><text x="486" y="332" font-size="10" >placed_at, placed_by, idempotency_key  (L1)</text><text x="486" y="352" font-size="10" >origin  LIVE | MIGRATED, migration_batch_id  (L1)</text><text x="486" y="372" font-size="10" >legacy_order_ref  (L1, migrated orders)</text><text x="486" y="392" font-size="10" >row_version</text><rect x="480" y="410" width="400" height="348" fill="#fff" stroke="#6c8ebf" /><rect x="480" y="410" width="400" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="486" y="428" font-size="12" font-weight="bold">sales_order_line</text><text x="486" y="452" font-size="10" font-weight="bold">PK  ..., sales_order_id, line_no<