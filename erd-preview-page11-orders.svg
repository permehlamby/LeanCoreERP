-size="10" >line_no, event_at, event_by, reason_code</text><rect x="920" y="760" width="400" height="128" fill="#fff" stroke="#82b366" /><rect x="920" y="760" width="400" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="926" y="778" font-size="12" font-weight="bold">ic_order_link</text><text x="926" y="802" font-size="10" font-weight="bold">PK  tenant_id, ic_transaction_id</text><text x="926" y="822" font-size="10" >sales_company_id, sales_order_id  (L1)</text><text x="926" y="842" font-size="10" >purchase_company_id, purchase_order_id  (L1)</text><text x="926" y="862" font-size="10" >created_at, created_by, correlation_id, idempotency_key</text><text x="926" y="882" font-size="10" >insert only, one pair across two companies, unique per order</text></svg>