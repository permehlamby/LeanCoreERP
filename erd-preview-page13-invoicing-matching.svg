<svg viewBox="0 0 1340 880" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif"><rect width="1340" height="880" fill="#fff"/><line x1="250" y1="338" x2="250" y2="360" stroke="#555" stroke-width="1" /><text x="254" y="346" font-size="9" fill="#555">1 : 1..n</text><line x1="720" y1="378" x2="720" y2="400" stroke="#555" stroke-width="1" /><text x="724" y="386" font-size="9" fill="#555">1 : 1..n</text><line x1="460" y1="204" x2="980" y2="114" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="724" y="156" font-size="9" fill="#555">built by the core</text><line x1="940" y1="224" x2="980" y2="114" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="964" y="166" font-size="9" fill="#555">posted from matched lines</text><line x1="940" y1="224" x2="1150" y2="420" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="1049" y="319" font-size="9" fill="#555">price difference on hand</text><line x1="940" y1="574" x2="1150" y2="378" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="1049" y="473" font-size="9" fill="#555">GR/IR clearing</text><path d="M 460 130 h 25 v 40 h -25" fill="none" stroke="#555" stroke-width="1"/><text x="490" y="155" font-size="9" fill="#555">credits_invoice_id / reversal_of</text><path d="M 940 130 h 25 v 40 h -25" fill="none" stroke="#555" stroke-width="1"/><text x="970" y="155" font-size="9" fill="#555">credits_invoice_id / reversal_of</text><line x1="1150" y1="158" x2="1150" y2="200" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="1154" y="176" font-size="9" fill="#555">1 : 1..n</text><rect x="40" y="70" width="420" height="268" fill="#fff" stroke="#82b366" /><rect x="40" y="70" width="420" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="46" y="88" font-size="12" font-weight="bold">sales_invoice  (link record)</text><text x="46" y="112" font-size="10" font-weight="bold">PK  tenant_id, company_id, sales_invoice_id</text><text x="46" y="132" font-size="10" >invoice_kind  INVOICE | CREDIT_NOTE | REVERSAL</text><text x="46" y="152" font-size="10" >FK customer_partner_id, order_currency</text><text x="46" y="172" font-size="10" >invoice_date, due_date, FK payment_terms_id</text><text x="46" y="192" font-size="10" >FK journal_document_id  (AR_INVOICE / AR_CREDIT / mirror)</text><text x="46" y="212" font-size="10" >FK credits_invoice_id, credit_kind  RETURN | AMOUNT</text><text x="46" y="232" font-size="10" >FK reversal_of_sales_invoice_id  (REVERSAL only)</text><text x="46" y="252" font-size="10" >reason_code</text><text x="46" y="272" font-size="10" >invoice_mode  CORE_BUILDS | APP_SUPPLIES</text><text x="46" y="292" font-size="10" >ic_transaction_id  (AR side of an IC invoice)</text><text x="46" y="312" font-size="10" >source_system, source_document_ref</text><text x="46" y="332" font-size="10" >created_at, created_by, correlation_id, idempotency_key</text><rect x="40" y="360" width="420" height="228" fill="#fff" stroke="#82b366" /><rect x="40" y="360" width="420" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="46" y="378" font-size="12" font-weight="bold">sales_invoice_line</text><text x="46" y="402" font-size="10" font-weight="bold">PK, FK  ..., sales_invoice_id, line_no</text><text x="46" y="422" font-size="10" >FK sales_order_id, sales_order_line_no</text><text x="46" y="442" font-size="10" >FK delivery_id, delivery_line_no  (null if none named)</text><text x="46" y="462" font-size="10" >FK dropship_confirmation_id  (DROPSHIP lines)</text><text x="46" y="482" font-size="10" >quantity, unit_code, base_quantity  (signed on credit / reversal)</text><text x="46" y="502" font-size="10" >unit_price, discount_pct, net_amount  (as invoiced)</text><text x="46" y="522" font-size="10" >order_unit_price, order_discount_pct  (APP_SUPPLIES only)</text><text x="46" y="542" font-size="10" >tax_code_id, tax_code_version_id, tax_date</text><text x="46" y="562" font-size="10" >journal_line_no  (revenue line)</text><text x="46" y="582" font-size="10" >credits_invoice_line_no, return_id, return_line_no</text><rect x="500" y="70" width="440" height="308" fill="#fff" stroke="#82b366" /><rect x="500" y="70" width="440" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="506" y="88" font-size="12" font-weight="bold">purchase_invoice  (supplied, matched)</text><text x="506" y="112" font-size="10" font-weight="bold">PK  tenant_id, company_id, purchase_invoice_id</text><text x="506" y="132" font-size="10" >invoice_kind  INVOICE | CREDIT_NOTE | REVERSAL</text><text x="506" y="152" font-size="10" >FK supplier_partner_id</text><text x="506" y="172" font-size="10" >UK supplier_invoice_number per supplier  (null on REVERSAL)</text><text x="506" y="192" font-size="10" >invoice_date, due_date, currency</text><text x="506" y="212" font-size="10" >gross_amount  (control total, negated on credit / reversal)</text><text x="506" y="232" font-size="10" >FK journal_document_id  (AP_INVOICE / AP_CREDIT / mirror)</text><text x="506" y="252" font-size="10" >FK stock_document_id  (cost adjustment, if any)</text><text x="506" y="272" font-size="10" >FK credits_invoice_id, credit_kind  RETURN | AMOUNT</text><text x="506" y="292" font-size="10" >FK reversal_of_purchase_invoice_id  (REVERSAL only)</text><text x="506" y="312" font-size="10" >reason_code</text><text x="506" y="332" font-size="10" >ic_transaction_id  (AP side of an IC invoice)</text><text x="506" y="352" font-size="10" >source_system, source_document_ref</text><text x="506" y="372" font-size="10" >created_at, created_by, correlation_id, idempotency_key</text><rect x="500" y="400" width="440" height="348" fill="#fff" stroke="#82b366" /><rect x="500" y="400" width="440" height="28" fill="#d5e8d4" stroke="#82b366"/><text x="506" y="418" font-size="12" font-weight="bold">purchase_invoice_line</text><text x="506" y="442" font-size="10" font-weight="bold">PK, FK  ..., purchase_invoice_id, line_no</text><text x="506" y="462" font-size="10" >line_kind  MATCHED | CHARGE</text><text x="506" y="482" font-size="10" >description, charge_treatment  (CHARGE: EXPENSE | LANDED_COST)</text><text x="506" y="502" font-size="10" >FK purchase_order_id, purchase_order_line_no  (null for charge / direct receipt)</text><text x="506" y="522" font-size="10" >FK receipt_id, receipt_line_no  (allocation)</text><text x="506" y="542" font-size="10" >receipt_ref: FK stock_document_id, line_no  (direct receipt, no order)</text><text x="506" y="562" font-size="10" >base_quantity, unit_price, net_amount, tax_amount</text><text x="506" y="582" font-size="10" >order_unit_price</text><text x="506" y="602" font-size="10" >match_mode_used, tolerance_used  (line tolerance, pct)</text><text x="506" y="622" font-size="10" >price_difference_lc  (always posted, never rejected)</text><text x="506" y="642" font-size="10" >on_hand_part_lc, consumed_part_lc  (inventory, COGS)</text><text x="506" y="662" font-size="10" >dropship_part_lc, unreceived_gr_ir_lc  (two-way part)</text><text x="506" y="682" font-size="10" >FK gr_ir_clearing_id</text><text x="506" y="702" font-size="10" >tax_code_id, tax_code_version_id, tax_date</text><text x="506" y="722" font-size="10" >journal_line_no</text><text x="506" y="742" font-size="10" >credits_invoice_line_no, return_id, return_line_no</text><rect x="980" y="70" width="340" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="980" y="70" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="986" y="88" font-size="12" font-weight="bold">journal_document  (stub)</text><text x="986" y="112" font-size="10" >AR_INVOICE | AR_CREDIT | AP_INVOICE | AP_CREDIT</text><text x="986" y="132" font-size="10" >source_system = ORDER_MGMT</text><text x="986" y="152" font-size="10" >detail_digest = digest of components  (L1)</text><rect x="980" y="200" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="980" y="200" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="986" y="218" font-size="12" font-weight="bold">journal_line  (stub)</text><text x="986" y="242" font-size="10" >revenue, tax, GR/IR, inventory/COGS lines</text><text x="986" y="262" font-size="10" >AR/AP control line = open item with due date</text><rect x="980" y="310" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="980" y="310" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="986" y="328" font-size="12" font-weight="bold">clearing  (stub)</text><text x="986" y="352" font-size="10" >GR/IR receipt credit cleared against</text><text x="986" y="372" font-size="10" >invoice GR/IR debit, same value</text><rect x="980" y="420" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="980" y="420" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="986" y="438" font-size="12" font-weight="bold">stock_document  (stub)</text><text x="986" y="462" font-size="10" >STOCK_COST_ADJUSTMENT (external journal mode)</text><text x="986" y="482" font-size="10" >COST_ADJUST movements</text><rect x="980" y="540" width="340" height="148" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="980" y="540" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="986" y="558" font-size="12" font-weight="bold">credit-exposures:query  (read API, nothing stored)</text><text x="986" y="582" font-size="10" >limit: partner_company_relation.credit_limit</text><text x="986" y="602" font-size="10" >tenant limit: business_partner.tenant_credit_limit</text><text x="986" y="622" font-size="10" >ar_open_items  (from open-items:query)</text><text x="986" y="642" font-size="10" >delivered_not_invoiced  (delivery - invoice lines)</text><text x="986" y="662" font-size="10" >open_orders  (undelivered order lines)</text><text x="986" y="682" font-size="10" >headroom, over_limit  (never enforced)</text></svg>