<svg viewBox="0 0 1340 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif"><rect width="1340" height="900" fill="#fff"/><line x1="260" y1="318" x2="260" y2="400" stroke="#555" stroke-width="1" /><text x="264" y="356" font-size="9" fill="#555">1 : n</text><line x1="520" y1="404" x2="480" y2="194" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="504" y="296" font-size="9" fill="#555">backed by full export</text><line x1="730" y1="508" x2="730" y2="600" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="734" y="551" font-size="9" fill="#555">creates on execution</text><line x1="940" y1="164" x2="980" y2="234" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="964" y="196" font-size="9" fill="#555">issued file of invoice</text><line x1="1150" y1="158" x2="730" y2="300" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="944" y="226" font-size="9" fill="#555">status DELETION_PENDING</text><line x1="260" y1="590" x2="1150" y2="388" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="709" y="486" font-size="9" fill="#555">external codes</text><line x1="480" y1="194" x2="1150" y2="440" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="819" y="314" font-size="9" fill="#555">manifest lists heads and anchors</text><rect x="40" y="70" width="440" height="248" fill="#fff" stroke="#b85450" /><rect x="40" y="70" width="440" height="28" fill="#f8cecc" stroke="#b85450"/><text x="46" y="88" font-size="12" font-weight="bold">export_job</text><text x="46" y="112" font-size="10" font-weight="bold">PK  tenant_id, export_id</text><text x="46" y="132" font-size="10" >job_type  TENANT_EXPORT|AUDIT_PACKAGE|SAFT_DATASET|EINVOICE_DATASET|PARTNER_DATA_EXPORT</text><text x="46" y="152" font-size="10" >FK company_id  (null = tenant-wide)</text><text x="46" y="172" font-size="10" >parameters  (period, variant, partner, include_pii, key reference)</text><text x="46" y="192" font-size="10" >requested_by, requested_at, correlation_id, UK idempotency_key</text><text x="46" y="212" font-size="10" >status  (S)  REQUESTED|RUNNING|COMPLETE|FAILED|CANCELLED|EXPIRED</text><text x="46" y="232" font-size="10" >snapshot  (taken_at, ledger_seq per ledger, chain positions)</text><text x="46" y="252" font-size="10" >manifest_digest, artifact_count, total_bytes</text><text x="46" y="272" font-size="10" >storage_ref, expires_at</text><text x="46" y="292" font-size="10" >started_at, completed_at, failure_reason</text><text x="46" y="312" font-size="10" >acknowledged_by, acknowledged_at  (tenant export)</text><rect x="40" y="400" width="440" height="148" fill="#fff" stroke="#b85450" /><rect x="40" y="400" width="440" height="28" fill="#f8cecc" stroke="#b85450"/><text x="46" y="418" font-size="12" font-weight="bold">export_artifact</text><text x="46" y="442" font-size="10" font-weight="bold">PK, FK  tenant_id, export_id, artifact_no</text><text x="46" y="462" font-size="10" >name, format  CSV | NDJSON | JSON</text><text x="46" y="482" font-size="10" >table_or_entity</text><text x="46" y="502" font-size="10" >row_count, byte_size</text><text x="46" y="522" font-size="10" >sha256, storage_path</text><text x="46" y="542" font-size="10" >encrypted with the customer key reference</text><rect x="40" y="590" width="440" height="128" fill="#fff" stroke="#d6b656" /><rect x="40" y="590" width="440" height="28" fill="#fff2cc" stroke="#d6b656"/><text x="46" y="608" font-size="12" font-weight="bold">external_code_mapping  (V)</text><text x="46" y="632" font-size="10" font-weight="bold">PK  tenant_id, mapping_id, valid_from</text><text x="46" y="652" font-size="10" >standard_code  SAFT_OECD | EN16931 | national variant</text><text x="46" y="672" font-size="10" >entity_type  TAX_CODE|ACCOUNT|UNIT|PAYMENT_MEANS|...</text><text x="46" y="692" font-size="10" >entity_id, external_code, external_text</text><text x="46" y="712" font-size="10" >valid_from, valid_to</text><rect x="520" y="70" width="420" height="188" fill="#fff" stroke="#b85450" /><rect x="520" y="70" width="420" height="28" fill="#f8cecc" stroke="#b85450"/><text x="526" y="88" font-size="12" font-weight="bold">invoice_issue_record</text><text x="526" y="112" font-size="10" font-weight="bold">PK  tenant_id, company_id, issue_id</text><text x="526" y="132" font-size="10" >invoice_kind  SALES | PURCHASE</text><text x="526" y="152" font-size="10" >FK invoice_id  (link record)</text><text x="526" y="172" font-size="10" >format  XML | PDF, document_reference</text><text x="526" y="192" font-size="10" >document_sha256</text><text x="526" y="212" font-size="10" >issued_at, delivery_channel  EMAIL|PEPPOL|PORTAL|POST|OTHER</text><text x="526" y="232" font-size="10" >recorded_by, UK idempotency_key</text><text x="526" y="252" font-size="10" >retention class INVOICE_ISSUE</text><rect x="520" y="300" width="420" height="208" fill="#fff" stroke="#b85450" /><rect x="520" y="300" width="420" height="28" fill="#f8cecc" stroke="#b85450"/><text x="526" y="318" font-size="12" font-weight="bold">tenant_deletion_request</text><text x="526" y="342" font-size="10" font-weight="bold">PK  tenant_id, request_id</text><text x="526" y="362" font-size="10" >requested_by, requested_at</text><text x="526" y="382" font-size="10" >FK export_job_id  (acknowledged, newer than last posting)</text><text x="526" y="402" font-size="10" >export_acknowledged_by, export_acknowledged_at</text><text x="526" y="422" font-size="10" >approver_1, approved_1_at, approver_2, approved_2_at  (distinct)</text><text x="526" y="442" font-size="10" >waiting_until</text><text x="526" y="462" font-size="10" >retention_override, ack_by, reason</text><text x="526" y="482" font-size="10" >status  (S)  REQUESTED|EXPORT_PENDING|AWAITING_APPROVAL|WAITING|CANCELLED|EXECUTING|DELETED</text><text x="526" y="502" font-size="10" >cancelled_by, cancelled_at, cancel_reason</text><rect x="520" y="600" width="420" height="188" fill="#fff" stroke="#b85450" /><rect x="520" y="600" width="420" height="28" fill="#f8cecc" stroke="#b85450"/><text x="526" y="618" font-size="12" font-weight="bold">tenant_deletion_certificate  (platform level, survives the tenant)</text><text x="526" y="642" font-size="10" font-weight="bold">PK  certificate_id</text><text x="526" y="662" font-size="10" >tenant_id, tenant_code  (reference only)</text><text x="526" y="682" font-size="10" >request_id, export_job_id, export_manifest_digest</text><text x="526" y="702" font-size="10" >final_chain_heads, last_anchor_refs</text><text x="526" y="722" font-size="10" >row_counts_by_table</text><text x="526" y="742" font-size="10" >retention_override and unmet record classes</text><text x="526" y="762" font-size="10" >requested_by, approvers, executed_at, executed_by</text><text x="526" y="782" font-size="10" >certificate_digest</text><rect x="980" y="70" width="340" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="980" y="70" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="986" y="88" font-size="12" font-weight="bold">tenant  (stub, platform level)</text><text x="986" y="112" font-size="10" font-weight="bold">PK  tenant_id</text><text x="986" y="132" font-size="10" >status  ACTIVE|SUSPENDED|EXPORTED|DELETION_PENDING|DELETED</text><text x="986" y="152" font-size="10" >purpose  PRODUCTION | REHEARSAL | TEST</text><rect x="980" y="200" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="980" y="200" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="986" y="218" font-size="12" font-weight="bold">sales_invoice / purchase_invoice  (stub)</text><text x="986" y="242" font-size="10" >link records</text><text x="986" y="262" font-size="10" >invoices:record-issue</text><rect x="980" y="320" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="980" y="320" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="986" y="338" font-size="12" font-weight="bold">config and master  (stubs)</text><text x="986" y="362" font-size="10" >tax_code_version, account, unit, payment means</text><text x="986" y="382" font-size="10" >mapped by external_code_mapping</text><rect x="980" y="440" width="340" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="980" y="440" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="986" y="458" font-size="12" font-weight="bold">chains and anchors  (stub)</text><text x="986" y="482" font-size="10" >heads and last anchors listed in manifest</text><text x="986" y="502" font-size="10" >and in the deletion certificate</text></svg>