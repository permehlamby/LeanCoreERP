" y="802" font-size="10" >company_id, correlation_id</text><text x="46" y="822" font-size="10" >FK partner_id  (nullable, null for export jobs)</text><text x="46" y="842" font-size="10" >partner_count  (export jobs, else null)</text><text x="46" y="862" font-size="10" >FK export_job_id  (one row per export job)</text><text x="46" y="882" font-size="10" >FK document_id  (legal snapshot reads)</text><text x="46" y="902" font-size="10" >field_group  PII_* groups, LEGAL_SNAPSHOT, ORDER_ADDRESS,</text><text x="46" y="922" font-size="10" >     PII_EXTENSION, PII_CREDIT, SEARCH</text><text x="46" y="942" font-size="10" >purpose_code  (optional)</text><text x="46" y="962" font-size="10" >result_position</text><text x="46" y="982" font-size="10" >written in the same transaction as the read</text><rect x="420" y="800" width="340" height="128" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="420" y="800" width="340" height="28" fill="#f5f5f5" stroke="#999999"/><text x="426" y="818" font-size="12" font-weight="bold">audit-events  (computed view)</text><text x="426" y="842" font-size="10" >reads outbox_event where is_audit</text><text x="426" y="862" font-size="10" >not a union of audit tables, one event shape</text><text x="426" y="882" font-size="10" >linked by correlation_id</text><text x="426" y="902" font-size="10" >time, actor or entity filter required</text><text x="426" y="922" font-size="10" >needs read.audit</text></svg>