NTH</text><text x="426" y="572" font-size="10" >net_days, discount_days, discount_pct</text><text x="426" y="592" font-size="10" >active, row_version</text><rect x="420" y="650" width="340" height="128" fill="#fff" stroke="#6c8ebf" /><rect x="420" y="650" width="340" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="426" y="668" font-size="12" font-weight="bold">company_bank_account</text><text x="426" y="692" font-size="10" font-weight="bold">PK  tenant_id, company_id, bank_account_id</text><text x="426" y="712" font-size="10" >iban, bic, currency_code</text><text x="426" y="732" font-size="10" >payment_means_code, use_on_invoices</text><text x="426" y="752" font-size="10" >FK gl_account_id</text><text x="426" y="772" font-size="10" >active</text><rect x="800" y="70" width="340" height="248" fill="#fff" stroke="#b85450" /><rect x="800" y="70" width="340" height="28" fill="#f8cecc" stroke="#b85450"/><text x="806" y="88" font-size="12" font-weight="bold">master_change_log  (append-only)</text><text x="806" y="112" font-size="10" font-weight="bold">PK  tenant_id, change_id</text><text x="806" y="132" font-size="10" >change_set_id</text><text x="806" y="152" font-size="10" >entity_type, entity_id</text><text x="806" y="172" font-size="10" >action  CREATE|UPDATE|DEACTIVATE|REACTIVATE|CLEAR</text><text x="806" y="192" font-size="10" >app_id  (null for core changes)</text><text x="806" y="212" font-size="10" >field_name</text><text x="806" y="232" font-size="10" >is_pii  (old/new value null when true)</text><text x="806" y="252" font-size="10" >old_value, new_value</text><text x="806" y="272" font-size="10" >reason_code</text><text x="806" y="292" font-size="10" >changed_by, changed_at, correlation_id</text><text x="806" y="312" font-size="10" >FK command_log_id</text><rect x="800" y="340" width="340" height="148" fill="#fff" stroke="#b85450" /><rect x="800" y="340" width="340" height="28" fill="#f8cecc" stroke="#b85450"/><text x="806" y="358" font-size="12" font-weig