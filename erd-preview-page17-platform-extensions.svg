<svg viewBox="0 0 1340 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif"><rect width="1340" height="900" fill="#fff"/><line x1="230" y1="218" x2="230" y2="240" stroke="#555" stroke-width="1" /><text x="234" y="226" font-size="9" fill="#555">1 : n namespaces</text><line x1="230" y1="218" x2="230" y2="380" stroke="#555" stroke-width="1" /><text x="234" y="296" font-size="9" fill="#555">1 : n</text><line x1="230" y1="218" x2="230" y2="500" stroke="#555" stroke-width="1" /><text x="234" y="356" font-size="9" fill="#555">1 : n consumers</text><line x1="680" y1="358" x2="680" y2="390" stroke="#555" stroke-width="1" /><text x="684" y="371" font-size="9" fill="#555">1 : n</text><line x1="680" y1="618" x2="680" y2="640" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="684" y="626" font-size="9" fill="#555">compare and set per entity and namespace</text><line x1="420" y1="294" x2="480" y2="214" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="454" y="251" font-size="9" fill="#555">namespace of definition</text><line x1="880" y1="504" x2="920" y2="544" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="904" y="521" font-size="9" fill="#555">entity_key (logical, no FK)</text><line x1="680" y1="618" x2="680" y2="770" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="684" y="691" font-size="9" fill="#555">every change logged</text><line x1="1120" y1="340" x2="1120" y2="298" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="1124" y="316" font-size="9" fill="#555">position counter per tenant</text><line x1="230" y1="500" x2="920" y2="184" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="579" y="339" font-size="9" fill="#555">acked position</text><line x1="230" y1="380" x2="920" y2="184" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="579" y="279" font-size="9" fill="#555">readable event types</text><line x1="1120" y1="700" x2="1120" y2="298" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="1124" y="496" font-size="9" fill="#555">retention, max lag</text><rect x="40" y="70" width="380" height="148" fill="#fff" stroke="#6c8ebf" /><rect x="40" y="70" width="380" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="46" y="88" font-size="12" font-weight="bold">app_registration  (M)</text><text x="46" y="112" font-size="10" font-weight="bold">PK  tenant_id, app_id</text><text x="46" y="132" font-size="10" >UK app_code  (stable, immutable)</text><text x="46" y="152" font-size="10" >name</text><text x="46" y="172" font-size="10" >active  (inactive app cannot write or ack)</text><text x="46" y="192" font-size="10" >company_scope  (JSON, null = all companies)</text><text x="46" y="212" font-size="10" >row_version</text><rect x="40" y="240" width="380" height="108" fill="#fff" stroke="#6c8ebf" /><rect x="40" y="240" width="380" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="46" y="258" font-size="12" font-weight="bold">app_namespace  (M)</text><text x="46" y="282" font-size="10" font-weight="bold">PK  tenant_id, namespace  (lowercase, immutable)</text><text x="46" y="302" font-size="10" >FK app_id  (owner)</text><text x="46" y="322" font-size="10" >&quot;core&quot; reserved</text><text x="46" y="342" font-size="10" >only the owner writes values and definitions</text><rect x="40" y="380" width="380" height="88" fill="#fff" stroke="#6c8ebf" /><rect x="40" y="380" width="380" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="46" y="398" font-size="12" font-weight="bold">app_event_subscription  (M)</text><text x="46" y="422" font-size="10" font-weight="bold">PK, FK  tenant_id, app_id, event_type</text><text x="46" y="442" font-size="10" >event_type may end in * (family, e.g. stock.*)</text><text x="46" y="462" font-size="10" >audit events need read.audit, not a subscription</text><rect x="40" y="500" width="380" height="108" fill="#fff" stroke="#6c8ebf" /><rect x="40" y="500" width="380" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="46" y="518" font-size="12" font-weight="bold">app_consumer_offset  (M + S)</text><text x="46" y="542" font-size="10" font-weight="bold">PK, FK  tenant_id, app_id, consumer_id</text><text x="46" y="562" font-size="10" >last_position  (S, only increases)</text><text x="46" y="582" font-size="10" >updated_at  (S)</text><text x="46" y="602" font-size="10" >events:ack forward only, events:rewind = audit event</text><rect x="480" y="70" width="400" height="288" fill="#fff" stroke="#6c8ebf" /><rect x="480" y="70" width="400" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="486" y="88" font-size="12" font-weight="bold">extension_definition  (M)</text><text x="486" y="112" font-size="10" font-weight="bold">PK  tenant_id, definition_id</text><text x="486" y="132" font-size="10" >UK entity_type, namespace, attr_key</text><text x="486" y="152" font-size="10" >entity_type  (extendable types)</text><text x="486" y="172" font-size="10" >FK namespace -&gt; app_namespace</text><text x="486" y="192" font-size="10" >attr_key  (immutable)</text><text x="486" y="212" font-size="10" >data_type  TEXT|DECIMAL|DATE|BOOLEAN|REF  (IAP once used)</text><text x="486" y="232" font-size="10" >max_length / precision, scale</text><text x="486" y="252" font-size="10" >allowed_values  (JSON, TEXT)</text><text x="486" y="272" font-size="10" >ref_entity_type  (REF)</text><text x="486" y="292" font-size="10" >is_pii  (never in outbox payloads)</text><text x="486" y="312" font-size="10" >is_required_on_create  (always false in R1)</text><text x="486" y="332" font-size="10" >active, row_version</text><text x="486" y="352" font-size="10" >max 50 active per entity type and namespace</text><rect x="480" y="390" width="400" height="228" fill="#fff" stroke="#6c8ebf" /><rect x="480" y="390" width="400" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="486" y="408" font-size="12" font-weight="bold">extension_value  (M)</text><text x="486" y="432" font-size="10" font-weight="bold">PK  tenant_id, definition_id, entity_key</text><text x="486" y="452" font-size="10" >FK definition_id</text><text x="486" y="472" font-size="10" >entity_key  (canonical string of entity PK)</text><text x="486" y="492" font-size="10" >company_id  (copied, company-scoped entities)</text><text x="486" y="512" font-size="10" >value_text, value_decimal(28,8)</text><text x="486" y="532" font-size="10" >value_date, value_bool, value_ref</text><text x="486" y="552" font-size="10" >version_stamp  (informational, counter value after write)</text><text x="486" y="572" font-size="10" >exactly one value column set</text><text x="486" y="592" font-size="10" >no row_version  (counter in extension_counter)</text><text x="486" y="612" font-size="10" >null is not stored (clear = delete, history in log)</text><rect x="480" y="640" width="400" height="88" fill="#fff" stroke="#9673a6" /><rect x="480" y="640" width="400" height="28" fill="#e1d5e7" stroke="#9673a6"/><text x="486" y="658" font-size="12" font-weight="bold">extension_counter  (S)</text><text x="486" y="682" font-size="10" font-weight="bold">PK  tenant_id, entity_type, entity_key, namespace</text><text x="486" y="702" font-size="10" >counter  (S, BIGINT, never decreases, never deleted)</text><text x="486" y="722" font-size="10" >updated_at  (S)</text><rect x="920" y="70" width="400" height="228" fill="#fff" stroke="#b85450" /><rect x="920" y="70" width="400" height="28" fill="#f8cecc" stroke="#b85450"/><text x="926" y="88" font-size="12" font-weight="bold">outbox_event  (E, insert only)</text><text x="926" y="112" font-size="10" font-weight="bold">PK  tenant_id, position  (BIGINT, monotonic per tenant)</text><text x="926" y="132" font-size="10" >event_type, event_version, change</text><text x="926" y="152" font-size="10" >company_id  (null = tenant-level)</text><text x="926" y="172" font-size="10" >entity_type, entity_key, entity_version</text><text x="926" y="192" font-size="10" >occurred_at, actor_ref, app_id</text><text x="926" y="212" font-size="10" >correlation_id</text><text x="926" y="232" font-size="10" >is_audit</text><text x="926" y="252" font-size="10" >chain_ref  (JSON: type, scope, chain_seq, row_hash)</text><text x="926" y="272" font-size="10" >summary  (JSON, never PII)</text><text x="926" y="292" font-size="10" >purge only by retention (outbox_app_event_retention_days)</text><rect x="920" y="340" width="400" height="88" fill="#fff" stroke="#9673a6" /><rect x="920" y="340" width="400" height="28" fill="#e1d5e7" stroke="#9673a6"/><text x="926" y="358" font-size="12" font-weight="bold">outbox_head  (S)</text><text x="926" y="382" font-size="10" font-weight="bold">PK  tenant_id</text><text x="926" y="402" font-size="10" >last_position  (S)</text><text x="926" y="422" font-size="10" >lock that serialises position allocation</text><rect x="920" y="460" width="400" height="168" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="920" y="460" width="400" height="28" fill="#f5f5f5" stroke="#999999"/><text x="926" y="478" font-size="12" font-weight="bold">extendable entities  (stubs)</text><text x="926" y="502" font-size="10" >BUSINESS_PARTNER, PARTNER_COMPANY_RELATION</text><text x="926" y="522" font-size="10" >ACCOUNT, DIMENSION_VALUE, COMPANY</text><text x="926" y="542" font-size="10" >ITEM, ITEM_COMPANY, ITEM_WAREHOUSE, WAREHOUSE,</text><text x="926" y="562" font-size="10" >     WAREHOUSE_LOCATION, ITEM_PARTNER</text><text x="926" y="582" font-size="10" >SALES_ORDER(_LINE), PURCHASE_ORDER(_LINE)</text><text x="926" y="602" font-size="10" >OPEN_ITEM  (journal_line_open_item)</text><text x="926" y="622" font-size="10" >not posted journals, stock, fulfilment, clearings</text><rect x="480" y="770" width="400" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="480" y="770" width="400" height="28" fill="#f5f5f5" stroke="#999999"/><text x="486" y="788" font-size="12" font-weight="bold">master_change_log  (stub)</text><text x="486" y="812" font-size="10" >entity_type = EXTENSION_VALUE</text><text x="486" y="832" font-size="10" >action  CREATE | UPDATE | CLEAR, app_id</text><text x="486" y="852" font-size="10" >old and new value  (none if is_pii)</text><rect x="920" y="700" width="400" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="920" y="700" width="400" height="28" fill="#f5f5f5" stroke="#999999"/><text x="926" y="718" font-size="12" font-weight="bold">tenant_setting  (stub)</text><text x="926" y="742" font-size="10" >outbox_app_event_retention_days</text><text x="926" y="762" font-size="10" >outbox_consumer_max_lag_days</text><text x="926" y="782" font-size="10" >extension_max_definitions</text></svg>