<svg viewBox="0 0 1340 1000" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif"><rect width="1340" height="1000" fill="#fff"/><line x1="260" y1="318" x2="260" y2="360" stroke="#555" stroke-width="1" /><text x="264" y="336" font-size="9" fill="#555">1 : n</text><line x1="260" y1="318" x2="260" y2="560" stroke="#555" stroke-width="1" /><text x="264" y="436" font-size="9" fill="#555">1 : n</text><line x1="480" y1="194" x2="520" y2="144" stroke="#555" stroke-width="1" /><text x="504" y="166" font-size="9" fill="#555">1 : n runs</text><line x1="480" y1="194" x2="520" y2="374" stroke="#555" stroke-width="1" /><text x="504" y="281" font-size="9" fill="#555">1 : n chunks</text><line x1="260" y1="318" x2="740" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="504" y="391" font-size="9" fill="#555">maps legacy ids</text><line x1="480" y1="644" x2="520" y2="714" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="504" y="676" font-size="9" fill="#555">LEGACY_TAX_SUMMARY becomes</text><line x1="740" y1="290" x2="1160" y2="158" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="954" y="221" font-size="9" fill="#555">commit posts documents</text><line x1="960" y1="714" x2="1000" y2="654" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4"/><text x="984" y="681" font-size="9" fill="#555">first return</text><line x1="260" y1="360" x2="740" y2="218" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/><text x="504" y="286" font-size="9" fill="#555">compared</text><rect x="40" y="70" width="440" height="248" fill="#fff" stroke="#6c8ebf" /><rect x="40" y="70" width="440" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="46" y="88" font-size="12" font-weight="bold">migration_batch</text><text x="46" y="112" font-size="10" font-weight="bold">PK  tenant_id, batch_id</text><text x="46" y="132" font-size="10" >FK company_id  (one non-aborted batch per company, company DRAFT)</text><text x="46" y="152" font-size="10" >cutover_date, source_system, history_start_period</text><text x="46" y="172" font-size="10" >status  (S)  OPEN|VALIDATED|RECONCILED|COMMITTING|COMMITTED|SEALED|ABORTED|ROLLED_BACK</text><text x="46" y="192" font-size="10" >opened_by, opened_at</text><text x="46" y="212" font-size="10" >committed_at/by, sealed_at/by  (S)</text><text x="46" y="232" font-size="10" >commit_requested/approved by, at  (S, four-eyes in production)</text><text x="46" y="252" font-size="10" >seal_requested/approved by, at  (S)</text><text x="46" y="272" font-size="10" >accepted_reconciliation_id  (S)</text><text x="46" y="292" font-size="10" >correlation_id, idempotency_key</text><text x="46" y="312" font-size="10" >row_version</text><rect x="40" y="360" width="440" height="128" fill="#fff" stroke="#b85450" /><rect x="40" y="360" width="440" height="28" fill="#f8cecc" stroke="#b85450"/><text x="46" y="378" font-size="12" font-weight="bold">migration_control_total  (declared by ETL)</text><text x="46" y="402" font-size="10" font-weight="bold">PK  tenant_id, batch_id, control_no</text><text x="46" y="422" font-size="10" >control_kind  TB_BY_ACCOUNT|PL_YTD_BY_ACCOUNT|HISTORY_PL_BY_PERIOD_ACCOUNT|OPEN_ITEMS_BY_ACCOUNT|STOCK_VALUE_BY_ACCOUNT|STOCK_QTY_BY_ITEM|...</text><text x="46" y="442" font-size="10" >key_1, key_2</text><text x="46" y="462" font-size="10" >amount_lc, amount_gc, amount_rc, quantity, count</text><text x="46" y="482" font-size="10" >source_report_ref, declared_at, declared_by</text><rect x="40" y="560" width="440" height="168" fill="#fff" stroke="#b85450" /><rect x="40" y="560" width="440" height="28" fill="#f8cecc" stroke="#b85450"/><text x="46" y="578" font-size="12" font-weight="bold">migration_record  (staged, validated on receipt)</text><text x="46" y="602" font-size="10" font-weight="bold">PK  tenant_id, batch_id, record_no</text><text x="46" y="622" font-size="10" >record_type  HISTORY_PL_LINE|OPENING_BALANCE|OPEN_ITEM|GLOPEN_ITEM|STOCK_OPENING_LINE|OPEN_*_ORDER_LINE|DELIVERED/RECEIVED_NOT_INVOICED|DROPSHIP_PENDING|LEGACY_TAX_SUMMARY</text><text x="46" y="642" font-size="10" >legacy_ref  (latest per type and ref counts)</text><text x="46" y="662" font-size="10" >payload, payload_digest</text><text x="46" y="682" font-size="10" >status  RECEIVED | VALID | INVALID, errors</text><text x="46" y="702" font-size="10" >received_at, received_by</text><text x="46" y="722" font-size="10" >superseded  (S)</text><rect x="520" y="70" width="440" height="148" fill="#fff" stroke="#b85450" /><rect x="520" y="70" width="440" height="28" fill="#f8cecc" stroke="#b85450"/><text x="526" y="88" font-size="12" font-weight="bold">migration_reconciliation  (zero tolerance)</text><text x="526" y="112" font-size="10" font-weight="bold">PK  tenant_id, batch_id, reconciliation_id, check_no</text><text x="526" y="132" font-size="10" >check_code  TB_BALANCES|HISTORY_VS_DECLARED|OPEN_ITEMS_VS_TB|STOCK_VALUE_VS_TB|GR_IR_VS_TB|CLEARING_ZERO|VAT_VS_TB|...</text><text x="526" y="152" font-size="10" >key</text><text x="526" y="172" font-size="10" >declared_lc/gc/rc, computed_lc/gc/rc, difference_lc/gc/rc</text><text x="526" y="192" font-size="10" >result  PASS | FAIL | WARNING, detail</text><text x="526" y="212" font-size="10" >run_at, run_by</text><rect x="520" y="290" width="440" height="168" fill="#fff" stroke="#b85450" /><rect x="520" y="290" width="440" height="28" fill="#f8cecc" stroke="#b85450"/><text x="526" y="308" font-size="12" font-weight="bold">migration_commit_chunk</text><text x="526" y="332" font-size="10" font-weight="bold">PK  tenant_id, batch_id, chunk_no</text><text x="526" y="352" font-size="10" >area  HISTORY|OPENING_GL|OPEN_ITEMS|STOCK|</text><text x="526" y="372" font-size="10" >     ORDERS|FULFILMENT|RESERVATIONS|LEGACY_TAX  (commit order)</text><text x="526" y="392" font-size="10" >from_record_no, to_record_no, document_count</text><text x="526" y="412" font-size="10" >status  (S)  PENDING | DONE | FAILED, failure_codes</text><text x="526" y="432" font-size="10" >started_at, completed_at</text><text x="526" y="452" font-size="10" >one atomic transaction per chunk, resumable</text><rect x="520" y="470" width="440" height="128" fill="#fff" stroke="#6c8ebf" /><rect x="520" y="470" width="440" height="28" fill="#dae8fc" stroke="#6c8ebf"/><text x="526" y="488" font-size="12" font-weight="bold">legacy_id_map</text><text x="526" y="512" font-size="10" font-weight="bold">PK  tenant_id, source_system, entity_type, legacy_id</text><text x="526" y="532" font-size="10" >core_id</text><text x="526" y="552" font-size="10" >FK batch_id  (set by migration commits)</text><text x="526" y="572" font-size="10" >mapped_at, mapped_by, row_version</text><text x="526" y="592" font-size="10" >written by master data upsert and commits</text><rect x="520" y="620" width="440" height="188" fill="#fff" stroke="#b85450" /><rect x="520" y="620" width="440" height="28" fill="#f8cecc" stroke="#b85450"/><text x="526" y="638" font-size="12" font-weight="bold">legacy_tax_summary</text><text x="526" y="662" font-size="10" font-weight="bold">PK  tenant_id, company_id, summary_id</text><text x="526" y="682" font-size="10" >FK batch_id, FK registration_id</text><text x="526" y="702" font-size="10" >fiscal_year, vat_period_no, return_type</text><text x="526" y="722" font-size="10" >row_type, box_code | EC list keys | OSS keys</text><text x="526" y="742" font-size="10" >currency_code, base_amount, tax_amount</text><text x="526" y="762" font-size="10" >FK tax_code_id, FK vat_account_id</text><text x="526" y="782" font-size="10" >ledger_lc, ledger_gc, ledger_rc  (settled with first return)</text><text x="526" y="802" font-size="10" >reported_in_return_id  (S)</text><rect x="1000" y="70" width="320" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1000" y="70" width="320" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1006" y="88" font-size="12" font-weight="bold">journal_document  (stub)</text><text x="1006" y="112" font-size="10" >migration_batch_id  (L1)</text><text x="1006" y="132" font-size="10" >HISTORY_SUMMARY | OPENING | OPENING_ITEMS | CLOSING</text><text x="1006" y="152" font-size="10" >controlled exceptions end at the seal</text><rect x="1000" y="200" width="320" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1000" y="200" width="320" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1006" y="218" font-size="12" font-weight="bold">journal_line_open_item  (stub)</text><text x="1006" y="242" font-size="10" >legacy_document_date, legacy_posting_date</text><text x="1006" y="262" font-size="10" >legacy_document_ref  (L1)</text><rect x="1000" y="300" width="320" height="88" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1000" y="300" width="320" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1006" y="318" font-size="12" font-weight="bold">fiscal_year  (stub)</text><text x="1006" y="342" font-size="10" >is_history  (L1)</text><text x="1006" y="362" font-size="10" >history periods hard-closed at seal</text><text x="1006" y="382" font-size="10" >history years closed by the seal variant of year close</text><rect x="1000" y="410" width="320" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1000" y="410" width="320" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1006" y="428" font-size="12" font-weight="bold">stock_document  (stub)</text><text x="1006" y="452" font-size="10" >STOCK_OPENING, movement OPENING_IN</text><text x="1006" y="472" font-size="10" >values and FIFO layer dates supplied</text><rect x="1000" y="510" width="320" height="108" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1000" y="510" width="320" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1006" y="528" font-size="12" font-weight="bold">orders and fulfilment  (stub)</text><text x="1006" y="552" font-size="10" >origin  LIVE | MIGRATED</text><text x="1006" y="572" font-size="10" >migration_batch_id</text><text x="1006" y="592" font-size="10" >gr_ir_journal_line  (receipt line, dropship confirmation)</text><text x="1006" y="612" font-size="10" >legacy_order_ref, legacy_line_ref  (orders)</text><rect x="1000" y="620" width="320" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1000" y="620" width="320" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1006" y="638" font-size="12" font-weight="bold">vat_return_line  (stub)</text><text x="1006" y="662" font-size="10" >legacy_base_amount, legacy_tax_amount</text><text x="1006" y="682" font-size="10" >source of the first return</text><rect x="1000" y="720" width="320" height="68" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1000" y="720" width="320" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1006" y="738" font-size="12" font-weight="bold">account roles  (stub)</text><text x="1006" y="762" font-size="10" >MIGRATION_CLEARING  (zero at seal)</text><text x="1006" y="782" font-size="10" >HISTORY_RESULT  (zeroed by opening)</text><rect x="1000" y="820" width="320" height="48" fill="#fff" stroke="#999999" stroke-dasharray="5 4"/><rect x="1000" y="820" width="320" height="28" fill="#f5f5f5" stroke="#999999"/><text x="1006" y="838" font-size="12" font-weight="bold">tenant  (stub)</text><text x="1006" y="862" font-size="10" >purpose  PRODUCTION | REHEARSAL | TEST</text></svg>